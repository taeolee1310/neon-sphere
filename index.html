<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Neon Sphere – Enhanced Layout</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #0e0e10; /* 다크 그라데이션과 자연스럽게 어울리는 컬러 */
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    }

    /* 🔥 중앙에 캔버스를 담는 박스(브라우저에서 너무 크게 보이지 않도록 제한) */
    #canvas-wrapper {
      margin-top: 60px;
      width: 100%;
      max-width: 900px;   /* 데스크탑 기준 최대 크기 */
      padding: 0 24px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      width: 100% !important;
      height: auto !important;
      display: block;
      border-radius: 12px;
    }

    #mic-start {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: white;
      font-size: 18px;
      z-index: 999999;
      cursor: pointer;
      text-align: center;
      padding: 0 30px;
    }

    .theme-panel {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
      border-radius: 999px;
      padding: 8px 12px;
      display: flex;
      gap: 8px;
      z-index: 50;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .theme-btn {
      border: none;
      background: transparent;
      color: #ddd;
      font-size: 11px;
      padding: 5px 10px;
      border-radius: 999px;
      cursor: pointer;
    }

    .theme-btn.active {
      background: #fff;
      color: #000;
    }
  </style>
</head>

<body>
  <!-- 🔊 마이크 안내 -->
  <div id="mic-start" onclick="enableMic()">🔊 화면을 클릭하면 음성 반응이 활성화됩니다</div>

  <!-- 🟣 중앙 캔버스 영역 -->
  <div id="canvas-wrapper"></div>

  <!-- 🎨 테마 선택 -->
  <div class="theme-panel">
    <button class="theme-btn active" onclick="setTheme('orange', this)">Orange</button>
    <button class="theme-btn" onclick="setTheme('blue', this)">Blue</button>
    <button class="theme-btn" onclick="setTheme('purple', this)">Purple</button>
    <button class="theme-btn" onclick="setTheme('green', this)">Green</button>
  </div>

  <!-- p5.js + sound 추가 -->
  <script src="https://cdn.jsdelivr.net/npm/p5@1.5.0/lib/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.5.0/lib/addons/p5.sound.min.js"></script>
  <script src="sketch.js"></script>

  <script>
    function setTheme(theme, el) {
      if (window.setNeonTheme) window.setNeonTheme(theme);
      document.querySelectorAll('.theme-btn')
        .forEach(btn => btn.classList.remove('active'));
      el.classList.add('active');
    }

    function enableMic() {
      let el = document.getElementById("mic-start");
      if (el) el.style.display = "none";

      if (typeof getAudioContext === "function") {
        let ctx = getAudioContext();
        if (ctx.state !== "running") ctx.resume();
      }

      if (window.enableMicFromOutside) {
        window.enableMicFromOutside();
      }
    }
  </script>
</body>
</html>
