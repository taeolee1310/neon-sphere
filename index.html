<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Neon Sphere</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text",
        "Helvetica Neue", sans-serif;
      background: #f5f5f7;
    }

    /* 캔버스는 전체 화면 */
    canvas {
      display: block;
    }

    /* 우측 상단 테마 스위치 UI */
    .theme-panel {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 999px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
      padding: 8px 10px;
      display: flex;
      gap: 6px;
      align-items: center;
      border: 1px solid rgba(0, 0, 0, 0.04);
    }

    .theme-label {
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #888;
      margin-right: 4px;
      padding-left: 4px;
    }

    .theme-btn {
      border: none;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 11px;
      cursor: pointer;
      background: transparent;
      color: #555;
      transition: background 0.18s ease, color 0.18s ease, transform 0.12s ease;
    }

    .theme-btn:hover {
      background: rgba(0, 0, 0, 0.05);
      transform: translateY(-1px);
    }

    .theme-btn.active {
      background: #111;
      color: #fff;
    }

    /* 작은 화면에서 버튼 크기 조정 */
    @media (max-width: 600px) {
      .theme-panel {
        top: 10px;
        right: 10px;
        padding: 6px 8px;
      }
      .theme-label {
        display: none;
      }
      .theme-btn {
        padding: 4px 8px;
        font-size: 10px;
      }
    }
  </style>
</head>
<body>
  <!-- 테마 스위치 패널 -->
  <div class="theme-panel">
    <span class="theme-label">NEON THEME</span>
    <button class="theme-btn active" data-theme="orange" onclick="setTheme('orange', this)">Orange</button>
    <button class="theme-btn" data-theme="blue" onclick="setTheme('blue', this)">Blue</button>
    <button class="theme-btn" data-theme="purple" onclick="setTheme('purple', this)">Purple</button>
    <button class="theme-btn" data-theme="green" onclick="setTheme('green', this)">Green</button>
  </div>

  <!-- p5.js + 스케치 -->
  <script src="https://cdn.jsdelivr.net/npm/p5@1.5.0/lib/p5.min.js"></script>
  <script src="sketch.js"></script>

  <script>
    // 버튼 active 상태 토글 + p5 쪽 테마 변경 호출
    function setTheme(theme, btnEl) {
      if (window.setNeonTheme) {
        window.setNeonTheme(theme);
      }
      const buttons = document.querySelectorAll('.theme-btn');
      buttons.forEach((b) => b.classList.remove('active'));
      if (btnEl) btnEl.classList.add('active');
    }
  </script>
</body>
</html>
